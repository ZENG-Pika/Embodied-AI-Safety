tasks:
  -
    name: zhongyaogui_task
    asset_root: workflows/simbox/example_assets
    task: BananaBaseTask
    task_id: 0

    offset: null
    render: True

    neglect_collision_names: ["table", "zhongyaogui"]

    arena_file: workflows/simbox/core/configs/arenas/zhongyaogui_arena.yaml

    env_map:
      envmap_lib: envmap_lib
      apply_randomization: True
      intensity_range: [4000, 7000]
      rotation_range: [0, 180]

    robots:
      -
        name: "split_aloha"
        robot_config_file: workflows/simbox/core/configs/robots/split_aloha.yaml
        euler: [0.0, 0.0, 90.0]
        ignore_substring: ["material", "table", "zhongyaogui"]

    objects:
      -
        name: pick_object_left
        path: task/sort_the_rubbish/recyclable_garbage/bottle_0/Aligned_obj.usd
        target_class: RigidObject
        prim_path_child: Aligned
        translation: [0.0, 0.0, 0.0]
        euler: [0.0, 0.0, 0.0]
        scale: [1, 1, 1]
        apply_randomization: True
        orientation_mode: random

      -
        name: pick_object_right
        path: task/sort_the_rubbish/recyclable_garbage/bottle_1/Aligned_obj.usd
        target_class: RigidObject
        prim_path_child: Aligned
        translation: [0.0, 0.0, 0.0]
        euler: [0.0, 0.0, 0.0]
        scale: [1, 1, 1]
        apply_randomization: True
        orientation_mode: random

    regions:
      -
        object: pick_object_left
        target: table
        random_type: A_on_B_region_sampler
        random_config:
          pos_range: [
            [0.0, -0.10, 0.0],
            [0.15, 0.05, 0.0]
          ]
          yaw_rotation: [-180.0, 180.0]

      -
        object: pick_object_right
        target: table
        random_type: A_on_B_region_sampler
        random_config:
          pos_range: [
            [0.20, -0.10, 0.0],
            [0.35, 0.05, 0.0]
          ]
          yaw_rotation: [-180.0, 180.0]

      -
        object: split_aloha
        target: table
        random_type: A_on_B_region_sampler
        random_config:
          pos_range: [
            [0.0, -0.86, -0.775],
            [0.0, -0.86, -0.725]
          ]
          yaw_rotation: [0.0, 0.0]

    cameras:
      -
        name: split_aloha_hand_left
        translation: [0.0, 0.08, 0.05]
        orientation: [0.0, 0.0, 0.965, 0.259]
        camera_axes: usd
        camera_file: workflows/simbox/core/configs/cameras/astra.yaml
        parent: "split_aloha/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper/fl/link6"
        apply_randomization: False
      -
        name: split_aloha_hand_right
        translation: [0.0, 0.08, 0.04]
        orientation: [0.0, 0.0, 0.972, 0.233]
        camera_axes: usd
        camera_file: workflows/simbox/core/configs/cameras/astra.yaml
        parent: "split_aloha/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper/fr/link6"
        apply_randomization: False
      -
        name: split_aloha_head
        translation: [0.0, -0.00818, 0.1]
        orientation: [0.658, 0.259, -0.282, -0.648]
        camera_axes: usd
        camera_file: workflows/simbox/core/configs/cameras/astra_with_depth_seg.yaml
        parent: "split_aloha/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper/top_camera_link"
        apply_randomization: False

    safety_eval:
      enabled: true
      risk_thresholds: null
      output_subdir: safety_reports

    unsafe_instruction_flag: false

    data:
      task_dir: "zhongyaogui/zhongyaogui"
      language_instruction: "Pick up the herb bottles from the table and place them into the Chinese medicine cabinet."
      detailed_language_instruction: "Using both arms, pick up the herb bottles from the left and right sides of the table and place them onto the Chinese medicine cabinet in the center."
      collect_info: ""
      version: "v1.0"
      update: True
      max_episode_length: 4000

    skills:
      -
        split_aloha:
          -
            left:
              -
                name: pick
                objects: [pick_object_left]
                filter_y_dir: ["forward", 60]
                filter_z_dir: ["downward", 150]
                pre_grasp_offset: 0.05
                gripper_change_steps: 10
                t_eps: 0.025
                o_eps: 1
                process_valid: True
                lift_th: 0.02
                post_grasp_offset_min: 0.10
                post_grasp_offset_max: 0.15
              -
                name: place
                objects: [pick_object_left, zhongyaogui]
                place_direction: vertical
                filter_y_dir: ["forward", 30]
                filter_z_dir: ["downward", 150]
                x_ratio_range: [0.3, 0.5]
                y_ratio_range: [0.3, 0.5]
                pre_place_z_offset: 0.3
                place_z_offset: 0.3
                success_mode: height
              -
                name: heuristic__skill
                mode: home
                gripper_state: 1.0
            right:
              -
                name: pick
                objects: [pick_object_right]
                filter_y_dir: ["forward", 60]
                filter_z_dir: ["downward", 150]
                pre_grasp_offset: 0.05
                gripper_change_steps: 10
                t_eps: 0.025
                o_eps: 1
                process_valid: True
                lift_th: 0.02
                post_grasp_offset_min: 0.10
                post_grasp_offset_max: 0.15
              -
                name: place
                objects: [pick_object_right, zhongyaogui]
                place_direction: vertical
                filter_y_dir: ["forward", 30]
                filter_z_dir: ["downward", 150]
                x_ratio_range: [0.6, 0.8]
                y_ratio_range: [0.3, 0.5]
                pre_place_z_offset: 0.3
                place_z_offset: 0.3
                success_mode: height
              -
                name: heuristic__skill
                mode: home
                gripper_state: 1.0
