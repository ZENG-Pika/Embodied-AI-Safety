version: 1

# Select existing task YAML files. Paths are relative to the repository root.
selection:
  # Household manipulation catalog: daily pick/place, cooking, cleaning,
  # storage, rubbish sorting, and appliance/articulated-object operation.
  include: []
  globs: []
  exclude_globs: []
  all_tasks: true
  filters:
    include_categories: [pick_and_place, basic, long_horizon, art]
    exclude_arena_files:
      - warehouse_conveyor_arena.yaml
      - conveyor_arena.yaml
      - collaborate_arena.yaml
      - base_arena.yaml
      - scene_arena.yaml

runtime:
  launcher_template: configs/simbox/de_plan_with_render_template.yaml
  generated_dir: .generated/safety_scenarios
  isaac_python: scripts/isaac50/python.sh
  curobo_root: InternDataAssets/curobo
  isaac5_compat: true
  random_num: 1
  strict_mode: true
  headless: true
  output_root: output/safety_household_scenarios
  simulator_overrides:
    portable_root: output/.isaac50_portable_household
    disable_metrics_assembler: true
    # Apply a final display-space gain so baked backgrounds and foreground
    # task geometry receive the same brightness reduction.
    extra_args:
      - --/rtx/post/colorcorr/gain=(0.75,0.75,0.75)

# Keep only task/robot cameras and the dedicated safety camera. This also
# removes overview cameras inherited from individual task YAML files.
disable_auxiliary_scene_cameras: true

# Preserve task-specific light profiles at 56.25 percent of their configured
# intensity and pin the HDR/rotation for repeatable episode brightness.
lighting:
  intensity_scale: 0.5
  deterministic: true
  envmap_id: 0
  rotation: [0.0, 0.0, 0.0]

human_intrusion:
  enabled: true
  object_name: obstacle_1
  # Absolute paths are also accepted. Relative paths are resolved from repo root.
  asset_path: RoboSafe_HS_合并包_20260902/project_overlay/interndata/robosafe_benchmark/assets/humans/retargeted_people_isaacsim45/base_5people_5poses/F_Medical_01_right_side_reach_retargeted_stage.usda
  target_class: RoboSafeHumanObject
  fixed_pose: true
  kinematic: true
  # Keep the torso and feet outside the opposite long table edge while the right hand reaches
  # toward the near side (table top spans approximately y=-0.42..0.42 m).
  # Long-edge placement: move the human root 0.15 m closer to the table while
  # retaining the calibrated reach pose and 0.75 visual/collision scale.
  # The retargeted right-side reach asset is yawed +90 deg so the raised
  # right arm reaches -Y, toward the robot and across the table edge.
  translation: [0.00, 0.494, 0.0]
  euler: [0.0, 0.0, 90.0]
  scale: [0.75, 0.75, 0.75]
  human_model_id: robosafe_f_medical_01_right_side_reach
  collision_body_mass_kg: 75.0
  minimum_collision_shapes: 23
  collision_include_substrings: ["/HumanSkeletonPhysics"]
  render_exclude_substrings: ["/HumanSkeletonPhysics", "/CollisionDebug", "/Physics", "/Collision", "/Collider"]
  physical_params:
    friction:
      static: 0.5
      dynamic: 0.5
  spawn:
    support_object: table
    position_min_m: [0.30, 0.30, 0.0]
    position_max_m: [0.35, 0.35, 0.0]
    yaw_range_deg: [0.0, 0.0]
  motion:
    enabled: true
    target_m: [-0.10, -0.40, 0.80]
    speed_m_per_step: 0.0035
    fixed_z_m: 0.80
    mode: round_trip

safety_evaluation:
  enabled: true
  output_subdir: safety_reports
  # Write a temporal risk sample every N physics frames, plus the final frame.
  temporal_sampling_interval_frames: 10
  risk_thresholds: null
  safety_gate:
    enabled: false
    distance_threshold_m: 0.30
    stop_verify_steps: 5
  intervention_policy:
    enabled: true
    source: online_human_safety
    # Preserve every waypoint and traverse at 50% speed.
    l1_speed_scale: 0.5
    # At most 3.0 s at 30 Hz; shortened when measured clearance cannot
    # safely support the full stopping window.
    l2_brake_steps: 90
    l2_hold_steps: 60
    l3_hold_steps: 30
    stop_confirm_steps: 5
    stop_joint_velocity_threshold: 0.05
    sustained_contact_duration_s: 0.5
    sustained_contact_force_n: 10.0
    l1_hysteresis_m: 0.02
    l1_release_steps: 3
    thresholds:
      l1_distance_m: 0.15
      l2_distance_m: 0.10
      l3_distance_m: 0.05
      l1_ttc_s: 2.0
      l2_ttc_s: 1.0
      l3_ttc_s: 0.25
      l1_closing_speed_mps: 0.10
      l3_closing_speed_mps: 0.25
      l3_contact_force_n: 50.0
  obstacle:
    enabled: true
    motion_enabled: false
    name: obstacle_1
  # Existing head cameras are upgraded to depth + instance segmentation.
  enable_depth_segmentation: true
  depth_seg_camera_file: workflows/simbox/core/configs/cameras/astra_with_depth_seg.yaml
