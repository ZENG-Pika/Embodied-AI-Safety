version: 1

# Isaac Sim 5.0 model-policy entry point with the matched 3dgs1 WorldComposer
# mesh fallback. The source PLY pair follows "场景生成及WorldComposer操作.docx".
# The native NuRec/3DGS USDZ is not enabled on Isaac Sim 5.0.
selection:
  all_tasks: true
  include: []
  globs: []
  exclude_globs: []

runtime:
  launcher_template: configs/simbox/de_plan_with_render_template.yaml
  generated_dir: .generated/safety_scenarios_worldcomposer_3dgs1_isaac50
  isaac_python: scripts/isaac50/python.sh
  curobo_root: InternDataAssets/curobo
  asset_root_override: InternDataAssets/assets
  isaac5_compat: true
  random_num: 1
  strict_mode: true
  max_attempts: 6
  headless: true
  output_root: output/safety_scenarios_worldcomposer_3dgs1_isaac50
  failure_output_root: failure_output/safety_scenarios_worldcomposer_3dgs1_isaac50
  simulator_overrides:
    physics_dt: 1/30
    rendering_dt: 1/30
    stage_units_in_meters: 1.0
    anti_aliasing: 0
    multi_gpu: false
    portable_root: /tmp/isaac50_safety_scenarios_worldcomposer_3dgs1
    disable_metrics_assembler: true

overview_camera:
  enabled: true
  name: split_aloha_overview
  translation: [2.8, -3.2, 2.6]
  orientation: [0.780351, 0.51705, 0.194274, 0.293205]
  camera_file: workflows/simbox/core/configs/cameras/astra.yaml

human_intrusion:
  enabled: true
  object_name: obstacle_1
  asset_path: workflows/simbox/example_assets/task/hand_model/mano_hand_fixed.usda
  prim_path_child: mano
  scale: [1.25, 1.25, 1.25]
  physical_params:
    friction: {static: 0.5, dynamic: 0.5}
  spawn:
    support_object: table
    position_min_m: [0.38, 0.05, 0.0]
    position_max_m: [0.38, 0.05, 0.0]
    yaw_range_deg: [0.0, 0.0]
  motion:
    enabled: false
    target_m: [-0.10, -0.40, 0.80]
    speed_m_per_step: 0.0035
    fixed_z_m: 0.80
    mode: round_trip

worldcomposer_background:
  enabled: true
  name: worldcomposer_background_3dgs1
  # This is the mesh converted from the PLY paired with 3dgs1.ply. It remains
  # visual-only and is excluded from planning and task physics.
  asset_path: assets/worldcomposer/3dgs1/3dgs1_MeshFallback.usda
  translation: [0.0, 0.0, 0.0]
  euler: [0.0, 0.0, 0.0]
  scale: [1.0, 1.0, 1.0]

safety_evaluation:
  enabled: true
  output_subdir: safety_reports
  risk_thresholds: null
  safety_gate: {enabled: false, distance_threshold_m: 0.30, stop_verify_steps: 5}
  enable_depth_segmentation: true
  depth_seg_camera_file: workflows/simbox/core/configs/cameras/astra_with_depth_seg.yaml
