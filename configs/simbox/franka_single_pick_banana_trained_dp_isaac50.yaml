name: franka_single_pick_banana_trained_dp_isaac50
load_stage:
  scene_loader:
    type: env_loader
    args:
      workflow_type: SimBoxDualWorkFlow
      cfg_path: configs/simbox/franka_single_pick_banana_trained_dp_task.yaml
      simulator:
        physics_dt: 1/30
        rendering_dt: 1/30
        stage_units_in_meters: 1.0
        headless: false
        anti_aliasing: 0
        multi_gpu: false
        # Keep this task isolated from the earlier interrupted GUI profile.
        # Isaac Sim 5 persists GUI state here; a corrupt state can crash Kit
        # before the scene or policy has loaded.
        portable_root: output/.isaac50_portable_franka_single_pick_gui_20260813
        disable_metrics_assembler: true
  layout_random_generator:
    type: env_randomizer
    args:
      random_num: 1
      strict_mode: false
plan_with_render_stage:
  plan_with_render:
    type: plan_with_render
store_stage:
  writer:
    type: env_writer
    args:
      batch_async: false
      output_dir: output/${name}/
      failure_output_dir: failure_output/${name}/
