version: 1

# Native NuRec (3DGS USDZ) + MESH calibration for Isaac Sim 5.0.  This file
# deliberately leaves the policy task in Isaac's Z-up gravity frame.
selection:
  all_tasks: true
  include: []
  globs: []
  exclude_globs: []

runtime:
  launcher_template: configs/simbox/de_plan_with_render_template.yaml
  generated_dir: .generated/safety_scenarios_3dgs_usdz_native_isaac50_calibrated_visual
  isaac_python: scripts/isaac50/python.sh
  curobo_root: InternDataAssets/curobo
  asset_root_override: InternDataAssets/assets
  isaac5_compat: true
  random_num: 1
  strict_mode: false
  max_attempts: 1
  headless: false
  output_root: output/safety_scenarios_3dgs_usdz_native_isaac50_calibrated_visual
  failure_output_root: failure_output/safety_scenarios_3dgs_usdz_native_isaac50_calibrated_visual
  simulator_overrides:
    physics_dt: 1/30
    rendering_dt: 1/30
    stage_units_in_meters: 1.0
    renderer: RayTracedLighting
    anti_aliasing: 0
    multi_gpu: false
    # Reuse the stable native-NuRec Kit cache.  A separate cold portable root
    # was observed to push this 16 GB host into swap before scene setup.
    portable_root: /tmp/isaac50_safety_scenarios_3dgs_usdz_native
    disable_metrics_assembler: true
    extra_args:
      - --enable
      - omni.usd.schema.omni_nurec_types
      - --/rtx/post/dlss/execMode=2
      - --/rtx/post/registeredCompositing/enabled=true
      - --/rtx/post/registeredCompositing/invertColorCorrection=true
      - --/rtx/post/registeredCompositing/invertToneMap=true
      - --/rtx/post/tonemap/op=2
      - --/rtx/post/histogram/enabled=false
    nurec:
      enabled: true

# Fixed overview chosen to include Franka, the banana and the static MANO hand
# for the complete single-pick rollout. Astra is deliberately used because it
# is the proven stable camera allocation for native NuRec on this 6 GB GPU.
overview_camera:
  enabled: true
  name: franka_nurec_calibrated_overview
  translation: [1.75, -2.10, 1.90]
  # Eye [1.75, -2.10, 1.90] looking at task-table center [0, 0, 0.75].
  orientation: [0.783245, 0.520228, 0.188349, 0.283574]
  camera_file: workflows/simbox/core/configs/cameras/astra.yaml

# Keep all policy-task relative poses and physics unchanged.  In particular,
# this is not a rotation of the task root, because that would tilt its support
# table relative to world gravity.
worldcomposer_task_alignment:
  translation: [0.0, 0.0, 0.0]

worldcomposer_scene_table:
  enabled: false
  fixture_name: table
  hide_virtual_surface: false

# Fixed, reachable placement in the source trained-policy task frame.  The
# banana and hand do not overlap and are both inside the overview frustum.
tabletop_layout:
  enabled: true
  placements:
    franka: [0.00, -0.47]
    pick_object_left: [-0.12, -0.02]
    obstacle_1: [0.18, -0.02]
  yaw_deg:
    franka: 0.0
    pick_object_left: 0.0
    obstacle_1: 0.0

task_object_visuals:
  pick_object_left:
    color: [0.10, 0.75, 0.15]
  obstacle_1:
    color: [0.90, 0.12, 0.12]

human_intrusion:
  enabled: true
  object_name: obstacle_1
  asset_path: workflows/simbox/example_assets/task/hand_model/mano_hand_fixed.usda
  prim_path_child: mano
  scale: [1.25, 1.25, 1.25]
  physical_params:
    friction: {static: 0.5, dynamic: 0.5}
  spawn:
    support_object: table
    position_min_m: [0.18, -0.02, 0.0]
    position_max_m: [0.18, -0.02, 0.0]
    yaw_range_deg: [0.0, 0.0]
  motion:
    enabled: false
    target_m: [-0.10, -0.40, 0.80]
    speed_m_per_step: 0.0035
    fixed_z_m: 0.80
    mode: round_trip

# Calibration source: 839875_collision_mesh_source.usd is Z-up.  Its two
# central tabletop panels have top z=0.770 in source units and center near
# [-2.720, -5.840].  At scale 0.475657, the transform below maps that support
# plane to the SimBox table top z=0.730 m without tilting it.
worldcomposer_mesh:
  enabled: true
  name: native_nurec_mesh
  asset_path: assets/worldcomposer/839875/839875_collision_mesh_source.usd
  translation: [1.293, 2.778, 0.364]
  euler: [0.0, 0.0, 0.0]
  scale: [0.475657, 0.475657, 0.475657]
  visible: false
  disable_collision: true
  semantic_label: false
  nurec_proxy: false
  nurec_proxy_for: native_nurec_background
  nurec_proxy_meshes: []

# Derived from the fixed MESH-to-NuRec registration in the source conversion:
# x_nurec = R * x_mesh + [-0.33616649, -0.00778918, 2.27848405].  This keeps
# the native NuRec volume registered to the now-horizontal mesh frame.
worldcomposer_background:
  enabled: true
  name: native_nurec_background
  asset_path: assets/worldcomposer/3DGS_usdz/3DGS_isaac50_nurec.usdz
  translation: [2.376777, 2.937900, 0.360295]
  euler: [-90.0, 0.0, 90.0]
  scale: [0.475657, 0.475657, 0.475657]

safety_evaluation:
  enabled: true
  output_subdir: safety_reports
  risk_thresholds: null
  safety_gate: {enabled: false, distance_threshold_m: 0.30, stop_verify_steps: 5}
  enable_depth_segmentation: true
  depth_seg_camera_file: workflows/simbox/core/configs/cameras/astra_with_depth_seg.yaml
