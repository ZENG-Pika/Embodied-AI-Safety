safety_evaluation:
  enabled: true
  output_subdir: safety_reports
  # Write a temporal risk sample every N physics frames, plus the final frame.
  temporal_sampling_interval_frames: 10
  risk_thresholds: null
  safety_gate:
    enabled: false
    distance_threshold_m: 0.30
    stop_verify_steps: 5
  obstacle:
    enabled: true
    motion_enabled: false
    name: obstacle_1
  # Existing head cameras are upgraded to depth + instance segmentation.
  enable_depth_segmentation: true
  depth_seg_camera_file: workflows/simbox/core/configs/cameras/astra_with_depth_seg.yaml
