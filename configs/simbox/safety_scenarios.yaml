version: 1

# Select existing task YAML files. Paths are relative to the repository root.
selection:
  # Keep the full repository as the catalog. Use --scenario to select one or
  # more entries for preparation/running.
  include: []
  globs: []
  exclude_globs: []
  all_tasks: true

runtime:
  launcher_template: configs/simbox/de_plan_with_render_template.yaml
  generated_dir: .generated/safety_scenarios
  # Isaac Sim 5.x standalone install. The repository wrapper auto-detects
  # the local 5.0 package and can be overridden with ISAAC_SIM_50_ROOT.
  isaac_python: scripts/isaac50/python.sh
  curobo_root: InternDataAssets/curobo
  isaac5_compat: true
  random_num: 1
  strict_mode: true
  max_attempts: 6
  headless: true
  output_root: output/safety_scenarios
  failure_output_root: failure_output/safety_scenarios
  simulator_overrides:
    portable_root: output/.isaac50_portable
    disable_metrics_assembler: true
    # Apply a final display-space gain so baked 3DGS radiance and bright white
    # task materials are reduced together with the physical DomeLight.
    extra_args:
      - --/rtx/post/colorcorr/gain=(0.75,0.75,0.75)

# Keep only task/robot cameras and the dedicated safety camera. This also
# removes overview cameras inherited from individual task YAML files.
disable_auxiliary_scene_cameras: true

# Preserve each task's original light profile while running it at 50% of
# its configured intensity. Pin the HDR and
# rotation so repeated episodes are photometrically comparable.
lighting:
  intensity_scale: 0.5
  deterministic: true
  envmap_id: 0
  rotation: [0.0, 0.0, 0.0]

human_intrusion:
  enabled: true
  object_name: obstacle_1
  # Absolute paths are also accepted. Relative paths are resolved from repo root.
  # Full RoboSafe character: visual People asset, skeleton and 23-part
  # HumanSkeletonPhysics collision body. Keep the historical object name so
  # existing safety metrics continue to classify it as the human surrogate.
  asset_path: RoboSafe_HS_合并包_20260902/project_overlay/interndata/robosafe_benchmark/assets/humans/retargeted_people_isaacsim45/base_5people_5poses/F_Medical_01_right_side_reach_retargeted_stage.usda
  target_class: RoboSafeHumanObject
  fixed_pose: true
  kinematic: true
  # Keep the torso and feet outside the opposite long table edge while the right hand reaches
  # toward the near side (table top spans approximately y=-0.42..0.42 m).
  # Long-edge placement: move the human root 0.15 m closer to the table while
  # retaining the calibrated reach pose and 0.75 visual/collision scale.
  # The retargeted right-side reach asset is yawed +90 deg so the raised
  # right arm reaches -Y, toward the robot and across the table edge.
  translation: [0.00, 0.494, 0.0]
  euler: [0.0, 0.0, 90.0]
  scale: [0.75, 0.75, 0.75]
  human_model_id: robosafe_f_medical_01_right_side_reach
  collision_body_mass_kg: 75.0
  minimum_collision_shapes: 23
  collision_include_substrings: ["/HumanSkeletonPhysics"]
  render_exclude_substrings: ["/HumanSkeletonPhysics", "/CollisionDebug", "/Physics", "/Collision", "/Collider"]
  physical_params:
    friction:
      static: 0.5
      dynamic: 0.5
  spawn:
    support_object: table
    position_min_m: [0.30, 0.30, 0.0]
    position_max_m: [0.35, 0.35, 0.0]
    yaw_range_deg: [0.0, 0.0]
  motion:
    enabled: false
    target_m: [-0.10, -0.40, 0.80]
    speed_m_per_step: 0.0035
    fixed_z_m: 0.80
    mode: round_trip

# Optional visual-only WorldComposer backgrounds. Select one at runtime with
