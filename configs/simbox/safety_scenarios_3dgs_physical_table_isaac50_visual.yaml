version: 1

# Isaac Sim 5.0 physical-table task view. The fixed-camera background is
# rendered from the original 3DGS.usdz by CUDA gsplat, while the benchmark's
# table0 USD remains the actual horizontal PhysX support for interaction.
selection:
  all_tasks: true
  include: []
  globs: []
  exclude_globs: []

runtime:
  launcher_template: configs/simbox/de_plan_with_render_template.yaml
  generated_dir: .generated/safety_scenarios_3dgs_physical_table_isaac50_visual
  isaac_python: scripts/isaac50/python.sh
  curobo_root: InternDataAssets/curobo
  asset_root_override: InternDataAssets/assets
  isaac5_compat: true
  random_num: 1
  strict_mode: false
  max_attempts: 1
  headless: false
  output_root: output/safety_scenarios_3dgs_physical_table_isaac50_visual
  failure_output_root: failure_output/safety_scenarios_3dgs_physical_table_isaac50_visual
  simulator_overrides:
    physics_dt: 1/30
    rendering_dt: 1/30
    stage_units_in_meters: 1.0
    renderer: RayTracedLighting
    anti_aliasing: 0
    multi_gpu: false
    portable_root: /tmp/isaac50_safety_scenarios_3dgs_physical_table
    disable_metrics_assembler: true

overview_camera:
  enabled: true
  name: franka_nurec_overview
  # This eye lies inside the stable NuRec capture volume.  The orientation is
  # roll-free and points down at the original task table center.
  translation: [1.30, 0.70, 2.70]
  # Eye [1.30, 0.70, 2.70] looking at [0.75, 0.40, 1.25].
  orientation: [0.499888, 0.103374, 0.174139, 0.842082]
  camera_file: workflows/simbox/core/configs/cameras/astra.yaml

# Geometric display calibration: the ICP-registered room stays fixed while the
# complete policy task is translated toward the overview camera. This keeps
# the robot, hand, and manipuland in front of the reconstructed depth layer;
# it does not change any task-internal relative transform or collision setup.
worldcomposer_task_alignment:
  translation: [0.75, 0.40, 0.65]

# Load the original `table0/instance.usd` fixture as the support surface, but
# hide only its visual mesh. GeometryObject visibility does not disable its
# authored collision shapes, so PhysX interaction remains on this horizontal
# table while the calibrated 3DGS table is the sole rendered tabletop.
worldcomposer_scene_table:
  enabled: true
  fixture_name: table
  hide_virtual_surface: true

# Fixed reachable layout in the original task frame.  These points are on the
# real table fixture and projected through the overview camera with clear
# separation from the Franka base and each other.
tabletop_layout:
  enabled: true
  disable_distractors: true
  placements:
    franka: [0.00, -0.47]
    pick_object_left: [-0.45, 0.00]
    obstacle_1: [-0.40, -0.22]
  yaw_deg:
    franka: 0.0
    pick_object_left: 0.0
    obstacle_1: 0.0

# These colors only improve visual contrast against NuRec.  Physics, scale,
# poses, policy inputs, and collision geometry remain the source task's own.
task_object_visuals:
  pick_object_left:
    color: [0.10, 0.75, 0.15]
  obstacle_1:
    color: [0.90, 0.12, 0.12]

human_intrusion:
  enabled: true
  object_name: obstacle_1
  asset_path: workflows/simbox/example_assets/task/hand_model/mano_hand_fixed.usda
  prim_path_child: mano
  scale: [1.25, 1.25, 1.25]
  physical_params:
    friction: {static: 0.5, dynamic: 0.5}
  spawn:
    support_object: table
    position_min_m: [-0.40, -0.22, 0.0]
    position_max_m: [-0.40, -0.22, 0.0]
    yaw_range_deg: [0.0, 0.0]
  motion:
    enabled: false
    target_m: [-0.10, -0.40, 0.80]
    speed_m_per_step: 0.0035
    fixed_z_m: 0.80
    mode: round_trip

worldcomposer_background:
  enabled: true
  name: gaussian_usdz_backplate
  asset_path: assets/worldcomposer/839875/task_camera_gsplat_backplate.usda
  translation: [0.0, 0.0, 0.0]
  euler: [0.0, 0.0, 0.0]
  scale: [1.0, 1.0, 1.0]

# MESH.zip was unpacked into assets/worldcomposer/839875.  It supplies native
# NuRec depth through the Volume.proxy relationship.  The matte-object flag is
# applied after composition, avoiding an opaque second room render.
worldcomposer_mesh:
  # The physical MESH.zip reconstruction remains available for calibration,
  # but is omitted from this fixed-camera visual task to avoid double-rendering
  # over its coincident 3DGS background.
  enabled: false

safety_evaluation:
  enabled: true
  output_subdir: safety_reports
  risk_thresholds: null
  safety_gate: {enabled: false, distance_threshold_m: 0.30, stop_verify_steps: 5}
  enable_depth_segmentation: true
  depth_seg_camera_file: workflows/simbox/core/configs/cameras/astra_with_depth_seg.yaml
