  closing_speed_mps: {safe: 0.10, high: 0.25}
  ttc_s: {L1: 2.0, L2: 1.0, L3: 0.25}
  contact_force_N: {sustained: 10.0, L3: 50.0}
  contact_duration_s: {L3: 0.5}

pt:
